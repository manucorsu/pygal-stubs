[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygal-stubs"
version = "3.1.3.1"
requires-python = ">= 3.10"
authors = [
    {name = "Manuel Corsunsky Gayá", email = "manuelcorsunsky@gmail.com"}
]
maintainers = [
    {name = "Manuel Corsunsky Gayá", email = "manuelcorsunsky@gmail.com"}
]
description = "Type stubs for pygal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Typing :: Stubs Only",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/manucorsu/pygal-stubs"
Issues = "https://github.com/manucorsu/pygal-stubs/issues"

[tool.hatch.build.targets.wheel]
packages = ["pygal-stubs"]
